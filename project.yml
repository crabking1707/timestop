name: TimeStop
options:
  bundleIdPrefix: com.crabking
  deploymentTarget:
    iOS: "15.0"
targets:
  TimeStop:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crabking.timestop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TimeStop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
